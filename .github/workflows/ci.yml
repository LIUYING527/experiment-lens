name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK
        run: python -m pip install -e ./sdk/python
      - name: Run SDK tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v
      - name: Compile example
        run: python -m py_compile examples/vln_demo.py integrations/claude-code/hook.py integrations/claude-code/install_hooks.py
      - name: Test Claude Code hook adapter
        run: python -m unittest discover -s integrations/claude-code -p 'test_*.py' -v

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install viewer dependencies
        working-directory: viewer
        run: npm install
      - name: Check JavaScript syntax
        working-directory: viewer
        run: npm run check
